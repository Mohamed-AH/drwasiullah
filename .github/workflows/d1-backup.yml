name: D1 backup

# Every night: export the content database (Cloudflare D1) and commit the content as plain JSON under backup/ (only when it changed).
# This is a backup and an audit trail; the site is NOT built from it yet (docs/admin-portal-spec.md, phase 1).
# The users and audit tables are never written to git: this repository is public. D1 "Time Travel" keeps 7 days of point-in-time restore for those.
on:
  schedule:
    - cron: "37 2 * * *"         # 02:37 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export and commit
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set yet (docs/d1-setup.md). Nothing to back up."; exit 0
          fi
          npx --yes wrangler@4 d1 export drwasiullah --remote --output "$RUNNER_TEMP/d1.sql"
          node --no-warnings scripts/db.mjs export --from-sql "$RUNNER_TEMP/d1.sql" --out backup --all
          if git diff --quiet -- backup && [ -z "$(git ls-files --others --exclude-standard backup)" ]; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup
          git commit -m "D1 backup $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push to main"; exit 1
