name: Publish from the admin portal

# Started by the admin portal's "نشر" button (workflow_dispatch through the GitHub API). Exports the content database (Cloudflare D1)
# into site/data/library.json, checks the site still builds, commits to main; Cloudflare then builds and deploys as usual.
# Only the published rows are exported (drafts and hidden items stay in D1). See docs/admin-portal-spec.md.
on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Who pressed Publish (set by the portal)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTOR: ${{ inputs.actor }}            # passed through the environment, never pasted into the script text
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export, build, commit
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (docs/d1-setup.md)"; exit 1; fi
          npx --yes wrangler@4 d1 export drwasiullah --remote --output "$RUNNER_TEMP/d1.sql"
          node --no-warnings scripts/db.mjs export --from-sql "$RUNNER_TEMP/d1.sql" --out site --only data/library.json
          node scripts/build.mjs | tail -3                       # the site must still build with the new data
          if git diff --quiet -- site/data/library.json; then echo "Nothing new to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/library.json
          WHO=$(printf '%s' "$ACTOR" | tr -cd 'A-Za-z0-9@._+-' | cut -c1-80)
          git commit -m "Publish from the admin portal${WHO:+ (by $WHO)}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push to main"; exit 1
